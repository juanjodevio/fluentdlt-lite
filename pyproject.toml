[project]
name = "fluentdlt-lite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "dlt[sql-database]>=1.18.2",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "isort>=7.0.0",
    "pytest>=9.0.1",
]
integration = [
    "black>=25.11.0",
    "isort>=7.0.0",
    "psycopg2-binary>=2.9.11",
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
